name: Sync userscript to Cloudflare R2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Check the version changed with the script
        if: github.event_name == 'push'
        run: node tools/scripts/check-version.mjs --since "${{ github.event.before }}"

  upload:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build public and preview release userscripts
        env:
          LOG_SERVICE_CONFIG: ${{ secrets.LOG_SERVICE_CONFIG }}
        run: |
          npm run build -- --release
          npm run build:preview -- --release

      - name: Upload userscript
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::notice::R2 credentials are not configured; upload skipped."
            echo "R2 upload skipped: configure the four repository secrets and rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          aws s3 cp bella-live-clip.user.js "s3://${R2_BUCKET}/bella-live-clip.user.js" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/javascript" \
            --content-disposition "inline" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp bella-live-clip.preview.user.js "s3://${R2_BUCKET}/bella-live-clip.preview.user.js" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/javascript" \
            --content-disposition "inline" \
            --cache-control "no-cache, no-store, must-revalidate"
