name: Browser tests

# Manual only: run after changing export, media, danmaku or timeline code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
