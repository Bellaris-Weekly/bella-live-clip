name: Deploy diagnostic log service

on:
  push:
    branches: [main]
    paths:
      - src/server/**
      - src/shared/log-redaction.js
      - server/logs/**
      - tools/scripts/deploy-log-service.mjs
      - .github/workflows/deploy-logs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: production-diagnostic-logs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test --test-reporter=dot tools/tests/unit/logs-worker.test.mjs tools/tests/unit/deploy-log-service.test.mjs
      - name: Verify existing resources and update service
        env:
          LOG_SERVICE_CONFIG: ${{ secrets.LOG_SERVICE_CONFIG }}
        run: npm run logs:deploy
