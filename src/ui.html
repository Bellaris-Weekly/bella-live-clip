<button id="launcher" aria-label="直播片段助手">✂<span>片段</span></button>
<section id="panel" hidden aria-label="直播片段助手">
<div id="body">
<section id="library">
<div id="libraryToolbar" class="library-toolbar"><div id="members" class="members"></div><button id="refreshLibrary" class="text-button refresh-button" aria-label="刷新场次" title="刷新场次">↻</button></div>
<div id="cards" class="cards"></div><p id="libraryEmpty" class="empty" hidden></p>
</section>
<section id="editPage" hidden>
<div id="editorToolbar" class="editor-heading"><button id="back" class="text-button">← 选择直播</button><button id="refreshEditor" class="text-button">刷新录像</button></div>
<h2 id="recordTitle"></h2><p id="recordMeta"></p>
<div id="playerWrap"><video id="fullVideo" controls playsinline preload="metadata"></video><div id="videoLoading">正在加载画面…</div></div>
<div class="preview-toolbar"><button id="markStart" class="text-button">设为开始</button><div class="playback-center"><button id="togglePlayback" class="text-button" aria-label="播放" title="播放">▶</button><span id="clock">00:00:00.000</span></div><button id="markEnd" class="text-button">设为结束</button></div>
<div id="timeline" aria-label="剪辑时间轴"><div id="ticks"></div><div id="selection"></div><div id="playhead"></div><button id="startHandle" data-handle="start" role="slider" aria-label="选区起点"></button><button id="endHandle" data-handle="end" role="slider" aria-label="选区终点"></button></div>
<div id="timelineLabels"></div>
<div class="export-row"><label for="exportMode">导出方式</label><select id="exportMode"><option value="copy">原画快速 · 不重新编码</option><option value="precise">精确裁剪 · 重新编码</option></select></div><p class="hint">仅下载选中的内容；断流区间会分成独立文件。切点受视频帧与音频采样粒度影响。</p><button id="download" class="button export-button" hidden>下载选区 MP4 ↓</button>
</section>
<section id="offline" class="empty" hidden><h2>暂时无法打开本场直播</h2><p id="offlineReason"></p><button id="browseHistory" class="button">浏览历史场次</button><button id="retryCurrent" class="text-button">重新检查</button></section>
<section id="feedback" class="feedback" hidden><div id="status" role="status" aria-live="polite"></div><progress id="progress" max="100" value="0" hidden></progress><button id="cancel" class="text-button" hidden>取消</button><div id="downloads"></div></section>
</div>
<span class="resize" data-edge="n"></span><span class="resize" data-edge="s"></span><span class="resize" data-edge="e"></span><span class="resize" data-edge="w"></span><span class="resize" data-edge="nw"></span><span class="resize" data-edge="ne"></span><span class="resize" data-edge="sw"></span><span class="resize" data-edge="se"></span>
</section>
